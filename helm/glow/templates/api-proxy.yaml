{{- $prefix := include "glow.pathPrefix" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glow.fullname" . }}-api-proxy
  labels:
    app.kubernetes.io/name: glow-api-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        port_in_redirect off;

        location = /healthz {
            return 200;
        }

        {{- range .Values.microservices }}
        {{- $apiPrefix := printf "%s/api/%s" $prefix .apiPath }}
        location {{ $apiPrefix }}/ {
            proxy_pass http://glow-{{ .name }}:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = {{ $apiPrefix }} {
            return 301 {{ $apiPrefix }}/;
        }
        {{- end }}

        {{- $uiService := printf "%s-ui" .Release.Name }}
        {{- if $prefix }}
        location {{ $prefix }}/ {
            proxy_pass http://{{ $uiService }}:{{ .Values.ui.service.port }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix {{ $prefix | quote }};
        }
        location = {{ $prefix }} {
            return 301 {{ $prefix }}/;
        }
        {{- else }}
        location / {
            proxy_pass http://{{ $uiService }}:{{ .Values.ui.service.port }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glow.fullname" . }}-api-proxy
  labels:
    app.kubernetes.io/name: glow-api-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glow-api-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glow-api-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/api-proxy: {{ include "glow.pathPrefix" . | sha256sum | quote }}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          {{- if and .Values.apiProxy .Values.apiProxy.resources }}
          resources:
            {{- toYaml .Values.apiProxy.resources | nindent 12 }}
          {{- else }}
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 250m
          {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "glow.fullname" . }}-api-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "glow.fullname" . }}-api-proxy
  labels:
    app.kubernetes.io/name: glow-api-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: glow-api-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
