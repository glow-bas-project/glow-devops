# Copy to secrets.env (gitignored) or create glow-secrets directly with kubectl.
# Required keys for glow-secrets:
#
# POSTGRES_PASSWORD=glow
# GLOW_USER_OIDC_CLIENT_SECRET=...
# GLOW_RESTAURANT_OIDC_CLIENT_SECRET=...
# GLOW_ORDER_OIDC_CLIENT_SECRET=...
# GLOW_CART_OIDC_CLIENT_SECRET=...
# GLOW_COURIER_OIDC_CLIENT_SECRET=...
# GLOW_MENU_OIDC_CLIENT_SECRET=...
# GLOW_PAYMENT_OIDC_CLIENT_SECRET=...
#
# Generate OIDC values: ./scripts/ensure-oidc-secrets.sh
# Create secret: ./scripts/k8s.sh secrets apply local
