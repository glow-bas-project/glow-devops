.plugin_base:
  image: ${PLUGIN_GRADLE_IMAGE:-gradle:8.13-jdk21}
  cache:
    key: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .gradle/
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    PLUGIN_VALIDATE_CMD: "./gradlew --version --no-daemon && ./gradlew help --no-daemon --stacktrace"
    PLUGIN_TEST_CMD: "./gradlew clean check --no-daemon --stacktrace"
    PLUGIN_PUBLISH_LOCAL_CMD: "./gradlew publishToMavenLocal --no-daemon --stacktrace"
    PLUGIN_PUBLISH_CMD: "./gradlew publish --no-daemon --stacktrace"
    PLUGIN_GROUP_PATH: "com/glow"
    PLUGIN_ARTIFACT_ID: "$CI_PROJECT_NAME"
    PLUGIN_VERSION_FILE: "gradle.properties"
    PLUGIN_VERSION_KEY: "VERSION"

.plugin_validate:
  extends: .plugin_base
  stage: validate
  script:
    - sh -c "${PLUGIN_VALIDATE_CMD}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.plugin_test:
  extends: .plugin_base
  stage: test
  script:
    - sh -c "${PLUGIN_TEST_CMD}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.plugin_version_guard_mr:
  extends: .plugin_base
  stage: version_guard
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
  script:
    - |
      set -euo pipefail
      VERSION="$(awk -F= -v key="${PLUGIN_VERSION_KEY}" '$1 == key { print $2 }' "${PLUGIN_VERSION_FILE}" | tr -d '[:space:]')"
      if [ -z "${VERSION}" ]; then
        echo "VERSION_INVALID: ${PLUGIN_VERSION_KEY} missing in ${PLUGIN_VERSION_FILE}."
        exit 1
      fi
      if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$'; then
        echo "VERSION_INVALID: '${VERSION}' must match x.y.z or x.y.z-SNAPSHOT."
        exit 1
      fi
      ARTIFACT_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/${PLUGIN_GROUP_PATH}/${PLUGIN_ARTIFACT_ID}/${VERSION}/${PLUGIN_ARTIFACT_ID}-${VERSION}.pom"
      HTTP_CODE="$(curl -sS -o /dev/null -w "%{http_code}" -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "${ARTIFACT_URL}")"
      if [ "${HTTP_CODE}" = "200" ]; then
        echo "PLUGIN_VERSION_EXISTS: ${PLUGIN_GROUP_PATH}:${PLUGIN_ARTIFACT_ID}:${VERSION} already published."
        exit 1
      fi
      if [ "${HTTP_CODE}" != "404" ]; then
        echo "VERSION_CHECK_ERROR: Unexpected response ${HTTP_CODE}."
        exit 1
      fi
      echo "VERSION_CHECK_OK: ${VERSION} is valid and available."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.plugin_version_guard_main:
  extends: .plugin_version_guard_mr
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

.plugin_publish_local_smoke:
  extends: .plugin_base
  stage: publish
  script:
    - sh -c "${PLUGIN_PUBLISH_LOCAL_CMD}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.plugin_publish_main:
  extends: .plugin_base
  stage: publish
  needs:
    - job: plugin_test
    - job: plugin_version_guard_main
  script:
    - sh -c "${PLUGIN_PUBLISH_CMD}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
