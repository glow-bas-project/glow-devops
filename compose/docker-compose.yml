x-glow-java-env: &glow_java_env
  JAVA_OPTS_APPEND: -Dquarkus.http.host=0.0.0.0
  QUARKUS_LOG_CONSOLE_JSON: "false"
  QUARKUS_HTTP_PORT: "8080"
  QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080${GLOW_AUTH_PATH:-/auth}/realms/glow-realm
  QUARKUS_OIDC_TOKEN_ISSUER: ${authBaseUrl}/realms/glow-realm
  QUARKUS_OIDC_TLS_VERIFICATION: none
  QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
  QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

x-glow-traefik-common: &glow_traefik_common
  traefik.enable: "true"
  traefik.docker.network: glow-local


x-glow-size-small: &glow_size_small
  deploy:
    resources:
      limits:
        memory: 600M

x-glow-size-medium: &glow_size_medium
  deploy:
    resources:
      limits:
        memory: 1G

x-glow-size-large: &glow_size_large
  deploy:
    resources:
      limits:
        memory: 1200M

networks:
  glow-local:
    name: glow-local

volumes:
  glow-postgres-data:

############################################################
###################### Core Services #######################
############################################################

services:
  glow-postgres:
    <<: *glow_size_medium
    container_name: glow-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - glow-postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - glow-local

  glow-traefik:
    <<: *glow_size_medium
    container_name: glow-traefik
    image: traefik:v3.7.1
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - glow-local

  keycloak:
    <<: *glow_size_medium
    container_name: glow-keycloak
    image: quay.io/keycloak/keycloak:26.6
    command: start --import-realm
    depends_on:
      glow-postgres:
        condition: service_healthy
      glow-traefik:
        condition: service_started
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://glow-postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${authBaseUrl}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: ${GLOW_AUTH_PATH:-/auth}
      GLOW_AUTH_PATH: ${GLOW_AUTH_PATH:-/auth}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      authBaseUrl: ${authBaseUrl}
      authAdminUrl: ${authAdminUrl}
      GLOW_USER_OIDC_CLIENT_SECRET: ${GLOW_USER_OIDC_CLIENT_SECRET}
      GLOW_RESTAURANT_OIDC_CLIENT_SECRET: ${GLOW_RESTAURANT_OIDC_CLIENT_SECRET}
      GLOW_ORDER_OIDC_CLIENT_SECRET: ${GLOW_ORDER_OIDC_CLIENT_SECRET}
      GLOW_CART_OIDC_CLIENT_SECRET: ${GLOW_CART_OIDC_CLIENT_SECRET}
      GLOW_COURIER_OIDC_CLIENT_SECRET: ${GLOW_COURIER_OIDC_CLIENT_SECRET}
      GLOW_MENU_OIDC_CLIENT_SECRET: ${GLOW_MENU_OIDC_CLIENT_SECRET}
      GLOW_PAYMENT_OIDC_CLIENT_SECRET: ${GLOW_PAYMENT_OIDC_CLIENT_SECRET}
    volumes:
      - ../keycloak/glow-realm-realm.json:/opt/keycloak/data/import/glow-realm-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET $${GLOW_AUTH_PATH:-/auth}/realms/master HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q "200"',
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 120s
    labels:
      <<: *glow_traefik_common
      traefik.http.routers.keycloak.rule: Host(`${GLOW_EDGE_HOST:-localhost}`) && PathPrefix(`${GLOW_AUTH_PATH:-/auth}`)
      traefik.http.routers.keycloak.entrypoints: web
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
    networks:
      - glow-local

#######################################################
###################### Services #######################
#######################################################

  glow-restaurant:
    <<: *glow_size_medium
    image: ${SERVICE_IMAGE_REF:-${REGISTRY_PREFIX}/glow-restaurant-service:${IMAGE_TAG}}
    container_name: ${COMPOSE_SERVICE_NAME:-glow-restaurant}
    depends_on:
      glow-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      glow-traefik:
        condition: service_started
    environment:
      <<: *glow_java_env
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://glow-postgres:5432/glow_restaurant
    labels:
      <<: *glow_traefik_common
      traefik.http.routers.glow-restaurant.rule: Host(`${GLOW_EDGE_HOST:-localhost}`) && PathPrefix(`/api/restaurant`)
      traefik.http.routers.glow-restaurant.entrypoints: web
      traefik.http.middlewares.glow-restaurant-stripprefix.stripprefix.prefixes: /api/restaurant
      traefik.http.routers.glow-restaurant.middlewares: glow-restaurant-stripprefix
      traefik.http.services.glow-restaurant.loadbalancer.server.port: "8080"
    networks:
      - glow-local

  glow-user:
