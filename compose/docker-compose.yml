      QUARKUS_OIDC_CREDENTIALS_SECRET: ${GLOW_USER_OIDC_CLIENT_SECRET}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://glow-postgres:5432/glow_user
      # TODO: Might need to be addressed with a general solution
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost
    labels:
      <<: *glow_traefik_common
      traefik.http.routers.glow-user.rule: Host(`${GLOW_EDGE_HOST:-localhost}`) && PathPrefix(`/api/user`)
      traefik.http.routers.glow-user.entrypoints: web
      traefik.http.middlewares.glow-user-stripprefix.stripprefix.prefixes: /api/user
      traefik.http.routers.glow-user.middlewares: glow-user-stripprefix
