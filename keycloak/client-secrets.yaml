# Keycloak confidential clients -> compose/.env variable names.
# Used by ensure-oidc-secrets, export-keycloak-realm, and import-keycloak-realm.
clients:
  glow-user-service: GLOW_USER_OIDC_CLIENT_SECRET
  glow-restaurant-service: GLOW_RESTAURANT_OIDC_CLIENT_SECRET
  glow-order-service: GLOW_ORDER_OIDC_CLIENT_SECRET
  glow-cart-service: GLOW_CART_OIDC_CLIENT_SECRET
  glow-courier-service: GLOW_COURIER_OIDC_CLIENT_SECRET
  glow-menu-service: GLOW_MENU_OIDC_CLIENT_SECRET
  glow-payment-service: GLOW_PAYMENT_OIDC_CLIENT_SECRET
